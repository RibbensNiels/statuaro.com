<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noai, noimageai">
<meta name="color-scheme" content="light dark">
<title>Ribbens — In the making</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23000'/%3E%3Ctext x='16' y='29' font-family='Helvetica,Arial' font-weight='700' font-size='30' fill='%23fff' text-anchor='middle'%3E%E2%80%9C%3C/text%3E%3C/svg%3E">
<style>
  :root { --ink: #000; --paper: #fff; --pad: clamp(1.25rem, 3.5vw, 3rem); }
  @media (prefers-color-scheme: dark) { :root { --ink: #f5f5f5; --paper: #0a0a0a; } }
  * { box-sizing: border-box; margin: 0; }
  html { background: var(--paper); color: var(--ink); }
  body { min-height: 100dvh; display: grid; grid-template-rows: auto 1fr; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-weight: 700; -webkit-font-smoothing: antialiased; }
  header { display: flex; align-items: center; height: 3.75rem; padding: 0 var(--pad); border-bottom: 1px solid var(--ink); font-size: 1.375rem; letter-spacing: -.035em; }
  main { display: grid; align-content: center; padding: var(--pad); }
  h1 { font-size: clamp(3rem, 11vw, 9rem); letter-spacing: -.04em; line-height: 1; text-wrap: balance; }
</style>
</head>
<body>
  <header>Ribbens</header>
  <main><h1>In the making.</h1></main>
</body>
</html>
